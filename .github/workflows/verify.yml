name: Verify Judoju News
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-and-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COREPACK_HOME: ${{ github.workspace }}/.local-tools/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      EXPO_NO_TELEMETRY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      JUDOJU_NATIVE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified official tag
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified official tag
        with:
          node-version-file: .node-version
      - name: Install exact locked dependencies without lifecycle scripts
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify latest recorded search settings independently
        run: node scripts/verify-cloud08c-foundation.mjs
      - name: Verify source, contracts, web build and Android/iOS JS bundles
        run: corepack pnpm verify
# Native Android/iOS binaries, real devices, Supabase, worker and cloud release
# are separate gates. This workflow does not claim they passed.
